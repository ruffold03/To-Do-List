<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Простой и удобный список задач с сохранением в браузере.">
  <title>Список задач</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <div class="app__title-row">
        <div class="app__logo" aria-hidden="true">✓</div>
        <div>
          <h1 class="app__title">Список задач</h1>
          <p class="app__subtitle" id="subtitle">Всё под контролем</p>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему" title="Переключить тему">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
      </button>
    </header>

    <form class="add-form" id="addForm" autocomplete="off">
      <label class="visually-hidden" for="taskInput">Новая задача</label>
      <input
        class="add-form__input"
        id="taskInput"
        type="text"
        name="task"
        placeholder="Что нужно сделать?"
        maxlength="200"
        required
      >
      <button class="add-form__button" type="submit">
        <span aria-hidden="true">+</span>
        <span class="add-form__button-text">Добавить</span>
      </button>
    </form>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Фильтр задач">
        <button class="filters__button is-active" type="button" data-filter="all">Все</button>
        <button class="filters__button" type="button" data-filter="active">Активные</button>
        <button class="filters__button" type="button" data-filter="completed">Выполненные</button>
      </div>
      <button class="toolbar__clear" id="clearCompleted" type="button">Очистить выполненные</button>
    </div>

    <ul class="task-list" id="taskList" aria-live="polite"></ul>

    <div class="empty-state" id="emptyState" hidden>
      <div class="empty-state__icon" aria-hidden="true">🗒️</div>
      <p class="empty-state__title" id="emptyTitle">Пока пусто</p>
      <p class="empty-state__text" id="emptyText">Добавьте первую задачу — и она появится здесь.</p>
    </div>

    <footer class="app__footer">
      <span id="counter">0 задач</span>
      <span class="app__hint">Данные сохраняются в вашем браузере</span>
    </footer>
  </main>

  <template id="taskTemplate">
    <li class="task">
      <label class="task__check">
        <input class="task__checkbox" type="checkbox">
        <span class="task__box" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.5l4.5 4.5L19 7.5"></path>
          </svg>
        </span>
        <span class="task__text"></span>
      </label>
      <button class="task__delete" type="button" aria-label="Удалить задачу" title="Удалить">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path>
          <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"></path>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6M14 11v6"></path>
        </svg>
      </button>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
